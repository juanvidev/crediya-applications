server:
  port: 8080
spring:
  application:
    name: "CrediyaApplications"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"     # por defecto localhost si no existe
    port: "${DB_PORT:5432}"          # valor por defecto 5432
    database: "${DB_NAME:applicationsdb}"
    schema: "public"
    username: "${DB_USER:applicationsuser}"
    password: "${DB_PASS:applicationspass}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-doc"
jwt:
    json-exp-roles: "/roles"
    secret: "${JWT_SECRET}"
adapter:
  restconsumer:
    timeout: 150000
    url: "${AUTH_SERVICE_URL:http://localhost:8081/api/v1}"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
